[package]
name = "fileglyph-icon-handler"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]

# The crate body is #![cfg(windows)]; keeping the dependency target-gated lets the
# workspace build on Linux without pulling in a Windows-only crate.
[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
