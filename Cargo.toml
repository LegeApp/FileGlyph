[package]
name = "fileglyph"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Generate standardized text icons for Windows file extensions and install them as extension-level icon overrides."
license = "MIT"
publish = false

[workspace]
members = ["icon-handler"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
eframe = { version = "0.35.0", default-features = false, features = ["glow"] }
fontdue = "0.9.3"
ico = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
